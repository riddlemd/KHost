<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>KHost Screen</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            /* Double-click toggles full screen; without this it also selects the placeholder text. */
            user-select: none;
            -webkit-user-select: none;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            transition: opacity 120ms linear;
        }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a4a52;
            font: 600 28px system-ui, sans-serif;
            pointer-events: none;
        }

        #placeholder[hidden] { display: none; }

        #blanked {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3a3a42;
            font: 600 20px system-ui, sans-serif;
            pointer-events: none;
        }

        #blanked[hidden] { display: none; }

        #hostlost {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.72);
            color: #d8d8dc;
            font: 600 26px system-ui, sans-serif;
            pointer-events: none;
        }

        #hostlost small {
            color: #7a7a82;
            font: 400 15px system-ui, sans-serif;
        }

        #hostlost[hidden] { display: none; }
    </style>
</head>
<body>
    <video id="video" playsinline></video>
    <div id="placeholder">KHost</div>
    <div id="blanked" hidden>Video off</div>
    <div id="hostlost" hidden>Lost the host<small>Paused until KHost comes back</small></div>
    <script src="player.js"></script>
</body>
</html>
