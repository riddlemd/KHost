<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>KHost Screen</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            position: relative;
            /* Double-click toggles full screen; without this it also selects the placeholder text. */
            user-select: none;
            -webkit-user-select: none;
        }

        .video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Only the lower one paints black, or the incoming element hides the outgoing one
               behind an opaque backdrop instead of dissolving into it. */
            background: transparent;
            transition: opacity 120ms linear;
        }

        /* Two elements so a rebuilt stream can be brought up to speed behind the one still
           playing, and swapped for it once it has sound to give. */
        #video-b { opacity: 0; }

        /* The intro card's own layer, so a stop's fade can dim it while the card's timing sets
           the card. Over the song's picture and under a still, like the words. */
        #intro-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* No backdrop: it sits over whatever the song plays over, so the outline is what keeps it
           legible, the same dark edge the words are drawn with. Sized in a unit the script sets
           from the page the words are fitted to, so the card fits the band above a count-in. */
        .kh-intro {
            position: absolute;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--kh-intro-unit, 6px) * 1.2);
            padding: 0 calc(var(--kh-intro-unit, 6px) * 5);
            overflow: hidden;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            text-shadow:
                0 0 0.08em rgba(0, 0, 0, 0.85),
                0.04em 0.04em 0 rgba(0, 0, 0, 0.85),
                -0.04em 0.04em 0 rgba(0, 0, 0, 0.85),
                0.04em -0.04em 0 rgba(0, 0, 0, 0.85),
                -0.04em -0.04em 0 rgba(0, 0, 0, 0.85),
                0 0.1em 0.4em rgba(0, 0, 0, 0.6);
        }

        .kh-intro[hidden] { display: none; }

        /* Two lines at most, then an ellipsis: a long title wraps rather than shrinking to nothing. */
        .kh-intro__title {
            max-width: 100%;
            font-size: calc(var(--kh-intro-unit, 6px) * 5.4);
            font-weight: 700;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .kh-intro__artist,
        .kh-intro__singer {
            max-width: 100%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            line-height: 1.25;
        }

        .kh-intro__artist { font-size: calc(var(--kh-intro-unit, 6px) * 3.4); font-weight: 500; opacity: 0.9; }

        .kh-intro__singer { font-size: calc(var(--kh-intro-unit, 6px) * 3); font-weight: 600; }

        /* Phrased like the next-singer card's label: small capitals the eye skips to the name. */
        .kh-intro__label {
            font-size: 0.7em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.75;
        }

        #still {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #still[hidden] { display: none; }

        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a4a52;
            font: 600 28px system-ui, sans-serif;
            pointer-events: none;
        }

        #placeholder[hidden] { display: none; }

        #blanked {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3a3a42;
            font: 600 20px system-ui, sans-serif;
            pointer-events: none;
        }

        #blanked[hidden] { display: none; }

        #hostlost {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.72);
            color: #d8d8dc;
            font: 600 26px system-ui, sans-serif;
            pointer-events: none;
        }

        #hostlost small {
            color: #7a7a82;
            font: 400 15px system-ui, sans-serif;
        }

        #hostlost[hidden] { display: none; }

        /* Above a full-bleed still: the room reads it while an ad card or the venue card is up,
           which is most of the night. Below the corners, though; see .kh-corner. */
        #marquee {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 10;
            overflow: hidden;
            white-space: nowrap;
            color: var(--marquee-fg, #f2f2f5);
            font: 500 var(--marquee-font-size, 28px)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
            letter-spacing: 0.01em;
            padding: 0.62em 0;
            pointer-events: none;
            /* The video shows through, so the band reads as glass over the picture rather than a
               panel bolted across it. */
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
        }

        /* The venue's colour as a layer rather than the band's own background: it can then be held
           under full opacity without taking the text down with it. */
        #marquee::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--marquee-bg, #000);
            opacity: 0.82;
        }

        #marquee[hidden] { display: none; }

        /* One stack per corner, shared by the code and the break card; both sit above the marquee
           so a band pinned to the edge never covers a code or slices the card. */
        .kh-corner {
            position: absolute;
            z-index: 11;
            display: flex;
            flex-direction: column;
            gap: 1vmin;
        }

        .kh-corner:empty { display: none; }

        .kh-corner[data-corner="bottomright"] { right: var(--kh-corner-offset, 0.2vmin); bottom: var(--kh-corner-offset, 0.2vmin); align-items: flex-end; }
        .kh-corner[data-corner="bottomleft"]  { left:  var(--kh-corner-offset, 0.2vmin); bottom: var(--kh-corner-offset, 0.2vmin); align-items: flex-start; }
        .kh-corner[data-corner="topright"]    { right: var(--kh-corner-offset, 0.2vmin); top:    var(--kh-corner-offset, 0.2vmin); align-items: flex-end; }
        .kh-corner[data-corner="topleft"]     { left:  var(--kh-corner-offset, 0.2vmin); top:    var(--kh-corner-offset, 0.2vmin); align-items: flex-start; }

        /* What is playing between singers. Sized off the shorter side like the code beside it, so
           the pair hold their proportions together on any screen. */
        .kh-break-music {
            max-width: 40vmin;
            padding: 0.9vmin 1.4vmin;
            border-radius: 0.6vmin;
            background: rgba(16, 16, 20, 0.82);
            box-shadow: 0 0.4vmin 1.6vmin rgba(0, 0, 0, 0.45);
            color: #fff;
            font: 400 2vmin/1.25 system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: inherit;
        }

        /* The title carries the weight; the artist is the quieter half of the same line of
           thought, so it reads as one card rather than two facts. */
        .kh-break-music__title { display: block; font-weight: 600; }

        .kh-break-music__artist { display: block; opacity: 0.75; font-size: 0.82em; }

        /* Who is up. Fills the picture rather than taking a corner: it replaces the venue's card
           for a moment, so it is the thing being looked at, not an annotation on something else. */
        #nextSinger {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2vmin;
            background: #000;
            color: #fff;
            font: 400 4vmin/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 6vmin;
        }

        /* Sized off the shorter side like everything else here, so the words hold their
           proportions from a laptop lid to a projector. */
        #nextSinger .kh-next__label {
            font-size: 3vmin;
            letter-spacing: 0.4vmin;
            text-transform: uppercase;
            opacity: 0.65;
        }

        #nextSinger .kh-next__singer { font-size: 9vmin; font-weight: 700; }

        #nextSinger .kh-next__song { font-size: 3.4vmin; opacity: 0.8; max-width: 80vw; }

        /* The display above is an id rule and outranks the browser's own [hidden], so without this
           the card is painted from page load and never comes down, over the song and all. */
        #nextSinger[hidden] { display: none; }

        /* Sized off the shorter side, so a code is the same share of the picture on any screen,
           with a floor that keeps it scannable in a small window. */
        .kh-qr {
            /* A figure, and every user-agent stylesheet gives one a fixed 1em 40px margin that sat
               outside the corner offsets and swamped them, pinning the code regardless of setting. */
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4em;
            /* The white is the quiet zone, sized in modules (the unit a scanner measures it in) so it
               holds proportion at any size. The SVG no longer carries one, so this is the whole of it. */
            padding: max(3px, calc(var(--kh-qr-size) / var(--kh-qr-modules, 25) * var(--kh-qr-safezone, 1)));
            border-radius: 0.15vmin;
            background: #fff;
            box-shadow: 0 0.4vmin 1.6vmin rgba(0, 0, 0, 0.45);
            --kh-qr-size: 9.5vmin;
        }

        /* The largest is about as big as a code should ever get: it only has to be scannable from
           a table, and every vmin it takes is one the words are drawn around. The steps below are
           for a room close enough that even that is more than it needs. */
        .kh-qr[data-size="small"] { --kh-qr-size: 7.5vmin; }
        .kh-qr[data-size="medium"] { --kh-qr-size: 9.5vmin; }
        .kh-qr[data-size="large"] { --kh-qr-size: 12vmin; }

        /* Three pixels a module is about where a phone camera stops reading one, so a long payload
           holds the code above the venue's requested size rather than shrinking past scannable. */
        .kh-qr img {
            display: block;
            width: max(calc(var(--kh-qr-modules, 33) * 3px), var(--kh-qr-size));
            height: max(calc(var(--kh-qr-modules, 33) * 3px), var(--kh-qr-size));
        }

        .kh-qr figcaption {
            max-width: max(calc(var(--kh-qr-modules, 33) * 3px), var(--kh-qr-size));
            color: #101014;
            font: 600 max(11px, calc(var(--kh-qr-size) / 11))/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            overflow-wrap: anywhere;
        }


        #marquee[data-position="top"] { top: 0; }
        #marquee[data-position="bottom"] { bottom: 0; }

        /* A hairline of the text colour on the edge facing the picture. It reads as the band
           having a lit edge rather than as a box someone drew a border around. */
        #marquee::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, currentColor, transparent);
            opacity: 0.35;
        }

        #marquee[data-position="top"]::after { bottom: 0; }
        #marquee[data-position="bottom"]::after { top: 0; }

        /* The one change that dates it most: text sliding under a hard edge reads as a 90s ticker,
           while the same text dissolving at both ends reads as depth. */
        #marquee-viewport {
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
        }

        /* Pinned: the label holds the leading edge and the text runs past it, so a room glancing up
           always sees what the list is. It modifies the band rather than styling it. */
        #marquee-pin {
            position: relative;
            z-index: 1;
            display: none;
            box-sizing: border-box;
            width: 7.5em;
            flex: 0 0 7.5em;
            align-self: stretch;
            text-align: center;
            font-size: 0.55em;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: var(--marquee-fg, #f2f2f5);
            color: var(--marquee-bg, #000);
            /* Padded in its own em, which is 0.55 of the band's, so it fills the band's height
               whatever size the venue picked. */
            padding: 1.15em 0;
        }

        #marquee[data-pinned="true"] {
            display: flex;
            align-items: stretch;
            padding: 0;
        }

        #marquee[data-pinned="true"] #marquee-pin { display: block; }

        #marquee[data-pinned="true"] #marquee-viewport {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0.62em 0 0.62em 1.1em;
            /* Only the far end fades: the near end is the label, and a fade there would wash it
               into the text running out from under it. */
            mask-image: linear-gradient(90deg, #000 94%, transparent);
            -webkit-mask-image: linear-gradient(90deg, #000 94%, transparent);
        }

        /* Copies chase each other so the text never leaves a gap the width of the screen; how many
           there are is measured, not assumed: two of a short line would not reach across a full screen. */
        #marquee-track {
            display: inline-block;
            /* Restated rather than inherited: the band is fixed to an edge of the picture, so a
               second line would grow it over the video rather than push the page down. */
            white-space: nowrap;
            will-change: transform;
            animation: marquee-scroll var(--marquee-duration, 30s) linear infinite;
        }

        #marquee-track > span {
            display: inline-block;
            white-space: nowrap;
            padding-right: 4rem;
        }

        /* "Up next" as its own chip the room can skip, filled rather than outlined: at this size a
           999px border reads as brackets. Both colours are the venue's pair, inverted. */
        .marquee-label {
            font-size: 0.55em;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            background: var(--marquee-fg, #f2f2f5);
            color: var(--marquee-bg, #000);
            border-radius: 999px;
            padding: 0.5em 1em 0.45em;
            margin-right: 1em;
            vertical-align: 0.22em;
        }

        .marquee-sep {
            opacity: 0.38;
            padding: 0 0.55em;
            font-weight: 400;
        }

        /* The venue's own line, set apart from the names so it does not read as another singer. */
        .marquee-message {
            font-weight: 400;
            opacity: 0.88;
        }

        /* One copy's width, whatever the copy count is: the track carries as many as it takes to
           cover the screen, and shifting by exactly one puts the next where the last began. */
        @keyframes marquee-scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(calc(-100% / var(--marquee-copies, 2))); }
        }

        /* A scrolling band is the worst case for anyone who asked the OS to stop motion, so it
           holds still and shows the text from the start instead of hiding it. */
        @media (prefers-reduced-motion: reduce) {
            #marquee-track { animation: none; }
        }

    </style>
</head>
<body>
    <video id="video" class="video" playsinline></video>
    <video id="video-b" class="video" playsinline></video>
    <!-- The native path's picture. Sits with the video elements because it stands in their place:
         a song is drawn here or streamed there, never both. -->
    <canvas id="lyrics" class="video" hidden></canvas>
    <!-- The song's title and singer until its words start; filled by intro-card.js. -->
    <div id="intro-layer"></div>
    <!-- Break music and an ad's own bed. Audio-only and plays across the gap
         between songs, so it is a separate element rather than a second source on the video above. -->
    <audio id="background"></audio>
    <!-- Image ads and the venue card. Above the video so a still covers it, and hidden until asked for. -->
    <img id="still" hidden alt="" />
    <div id="placeholder">KHost</div>
    <div id="nextSinger" hidden>
        <span class="kh-next__label">Up next</span>
        <span class="kh-next__singer"></span>
        <span class="kh-next__song"></span>
    </div>
    <div id="blanked" hidden>Video off</div>
    <div id="hostlost" hidden>Lost the host<small>Paused until KHost comes back</small></div>
    <!-- Next singers and the venue's own line. Hidden until a venue turns it on. -->
    <div id="marquee" hidden data-position="bottom">
        <div id="marquee-pin">Up next</div>
        <div id="marquee-viewport">
            <div id="marquee-track"><span></span><span></span></div>
        </div>
    </div>
    <!-- One stack per corner, filled by the host with whatever the venue put there; stays out of
         the picture while empty. -->
    <div class="kh-corner" data-corner="topleft"></div>
    <div class="kh-corner" data-corner="topright"></div>
    <div class="kh-corner" data-corner="bottomleft"></div>
    <div class="kh-corner" data-corner="bottomright"></div>
    <script src="hls.light.min.js"></script>
    <script src="lyrics-overlay.js"></script>
    <script src="intro-card.js"></script>
    <script src="stem-mixer.js"></script>
    <script src="wake-watch.js"></script>
    <script src="player.js"></script>
</body>
</html>
