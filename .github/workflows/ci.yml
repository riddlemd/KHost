name: CI

on:
  # Off for push and PR until Oriel is on a feed a runner can reach: nuget.config maps Oriel* to a local folder
  # (../../Oriel/main/artifacts/pkg), so every leg fails at restore. Run by hand once that changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/KHost.UserInterface/package-lock.json

      # The lyric shaping tests shape Arabic and Hebrew in the face the painter picks; a bare
      # runner may have no font covering either script.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core

      # The UI build runs `npm run copy:vendors` and fails without node_modules.
      - run: npm ci
        working-directory: src/KHost.UserInterface

      # The screen page's scripts, under node's own runner: no packages to install.
      - run: npm test
        working-directory: src/KHost.LocalScreen/screen-ui-tests

      # Redirected like the README says, so the test step below finds the same output.
      - run: dotnet build KHost.slnx "-p:BaseOutputPath=./obj/_build"

      # Hermetic: no ffmpeg, no network, no OS keychain. The integration suite is not run here.
      - run: dotnet test tests/KHost.UnitTests "-p:BaseOutputPath=./obj/_build" --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results-${{ matrix.os }}
          path: TestResults/unit.trx
